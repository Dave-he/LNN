[project]
name = "lnn"
version = "0.1.0"
description = "Liquid Neural Networks - Engineering Practice & Research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "torchdiffeq>=0.2.3",
    "ncps>=0.0.2",
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]
lfm = [
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
]
viz = [
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "wandb>=0.15.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lnn*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers added by round 28 (§32) for regime-stratified testing.
# `large_budget` gates the h=64/ep=80 regime tests that are too slow for
# the default CI run.  Any future LNN multimodal PR *should* enable this
# marker in its CI pipeline so the regime-stratified behaviour of the
# model is verified.
markers = [
    "large_budget: tests that exercise the large-budget (hidden=64, ep=80) regime; slow and skipped by default",
    "regime: tests that are regime-conditional (small_budget or large_budget) on real EMMA rover data",
]
