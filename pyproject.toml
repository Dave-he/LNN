[project]
name = "lnn"
version = "0.1.0"
description = "Liquid Neural Networks - Engineering Practice & Research"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchdiffeq>=0.2.3",
    "ncps>=0.0.2",
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]
lfm = [
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
]
viz = [
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "wandb>=0.15.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lnn*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
